name: Test

on:
  pull_request:


permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        env:
          DOCKER: docker buildx
          DOCKER_BUILD_FLAGS: --load --cache-from=type=gha,scope=tulip-docker
          DOCKER_ARTIFACT_BUILD_FLAGS: --cache-from=type=gha,scope=tulip-docker --cache-to=type=gha,scope=tulip-docker,mode=max
        run: make build BUILD_JOBS=2

      - name: Run tests
        run: make test
