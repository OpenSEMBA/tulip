name: Build Ubuntu

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: build-ubuntu-main
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ubuntu bundle
        env:
          DOCKER: docker buildx
          DOCKER_BUILD_FLAGS: --load --cache-from=type=gha,scope=tulip-docker
          DOCKER_ARTIFACT_BUILD_FLAGS: --cache-from=type=gha,scope=tulip-docker --cache-to=type=gha,scope=tulip-docker,mode=max
        run: |
          make release-ubuntu RELEASE_ARCHIVE=release/tulip-ubuntu-26.04.tar.gz BUILD_JOBS=2
          release_date="$(date -u +'%Y-%m-%d')"
          echo "archive=release/tulip-ubuntu-26.04.tar.gz" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_date-tulip-ubuntu" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: package

      # A repeated build on the same day refreshes only that day's release.
      - name: Update today's Ubuntu release tag
        env:
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.package.outputs.commit }}
        run: |
          git tag --force "$RELEASE_TAG" "$RELEASE_COMMIT"
          git push --force origin "refs/tags/$RELEASE_TAG"

      - name: Publish Ubuntu release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          target_commitish: ${{ steps.package.outputs.commit }}
          name: ${{ steps.package.outputs.release_date }} Ubuntu TULIP
          prerelease: false
          make_latest: false
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true
          overwrite_files: true
