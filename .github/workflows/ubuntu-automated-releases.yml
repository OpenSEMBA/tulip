name: Ubuntu automated release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ubuntu-automated-release
  cancel-in-progress: true

jobs:
  release:
    name: Build, test, and publish Ubuntu release
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Get publication date
        id: date
        run: echo "date=$(date --utc +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build Ubuntu release
        run: make release-ubuntu VERSION=${{ steps.date.outputs.date }}

      - name: Test release build
        run: make test

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-tulip-${{ steps.date.outputs.date }}
          name: ${{ steps.date.outputs.date }} Ubuntu Tulip
          files: release/tulip-${{ steps.date.outputs.date }}-ubuntu-26.04.tar.gz
          make_latest: true
